<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Synth — 星と数の占い</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
      #app { position: relative; width: 100vw; height: 100vh; }

      #vignette {
        position: absolute; inset: 0; z-index: 5; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
      }

      #intro {
        position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        pointer-events: none; background: #000;
        transition: opacity 2.5s ease, background-color 2.5s ease;
      }
      #intro.fade { opacity: 0; background-color: transparent; }
      #intro .title {
        color: #e8ecff; font: 300 14px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.5em; text-indent: 0.5em; opacity: 0;
        animation: titleIn 3s ease forwards 0.3s;
      }
      #intro .subtitle {
        margin-top: 18px; color: #8fa0d8; font: 300 12px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.3em; text-indent: 0.3em; opacity: 0;
        animation: titleIn 3s ease forwards 1.1s;
      }
      @keyframes titleIn {
        from { opacity: 0; filter: blur(4px); }
        to { opacity: 1; filter: blur(0); }
      }

      #narration {
        position: absolute; left: 50%; top: 12%; z-index: 10;
        transform: translate(-50%, -50%);
        color: #d8e0ff; font: 300 15px/1.9 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.15em; text-align: center; white-space: nowrap;
        text-shadow: 0 0 16px rgba(140, 160, 255, 0.6);
        opacity: 0; pointer-events: none;
        transition: opacity 2.2s ease;
      }
      #narration.show { opacity: 0.85; }

      #chartLegend {
        position: absolute; left: 50%; bottom: 20px; z-index: 10;
        transform: translateX(-50%);
        color: #c4cdf0; font: 13px/1.8 system-ui, sans-serif; letter-spacing: 0.05em;
        text-align: center; white-space: nowrap; opacity: 0; pointer-events: none;
        transition: opacity 2s ease;
      }
      #chartLegend.show { opacity: 0.85; }

      #methodSelect {
        position: absolute; left: 50%; top: 50%; z-index: 15;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        padding: 32px 40px; border-radius: 4px;
        background: rgba(6, 8, 20, 0.55); backdrop-filter: blur(6px);
        border: 1px solid rgba(140, 160, 255, 0.2);
        opacity: 0; pointer-events: none;
        transition: opacity 1.8s ease;
      }
      #methodSelect.show { opacity: 1; pointer-events: auto; }
      #methodSelect .label {
        color: #9fb0e0; font: 300 13px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.2em; text-align: center;
      }
      #methodSelect .methods { display: flex; gap: 12px; }
      #methodSelect button {
        padding: 14px 20px; border-radius: 3px; cursor: pointer; min-width: 120px;
        background: rgba(140, 160, 255, 0.1); border: 1px solid rgba(160,180,255,0.4);
        color: #e8ecff; font: 300 13px/1.7 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.15em; transition: background 0.3s ease;
      }
      #methodSelect button:hover { background: rgba(140, 160, 255, 0.28); }
      #methodSelect button small { display: block; margin-top: 4px; color: #8290c0; font-size: 11px; letter-spacing: 0.05em; }

      #fortuneForm {
        position: absolute; left: 50%; top: 50%; z-index: 15;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        padding: 32px 40px; border-radius: 4px;
        background: rgba(6, 8, 20, 0.55); backdrop-filter: blur(6px);
        border: 1px solid rgba(140, 160, 255, 0.2);
        opacity: 0; pointer-events: none;
        transition: opacity 1.8s ease;
      }
      #fortuneForm.show { opacity: 1; pointer-events: auto; }
      #fortuneForm .label {
        color: #9fb0e0; font: 300 13px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.2em; text-align: center;
      }
      #fortuneForm input {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(160,180,255,0.35);
        color: #e8ecff; padding: 8px 12px; border-radius: 3px; font: 13px system-ui, sans-serif;
        color-scheme: dark;
      }
      #fortuneForm #nameField { display: none; }
      #fortuneForm.numerology #nameField { display: block; }
      #fortuneForm #nameField input { width: 200px; }
      #fortuneForm button {
        margin-top: 4px; padding: 9px 28px; border-radius: 3px; cursor: pointer;
        background: rgba(140, 160, 255, 0.18); border: 1px solid rgba(160,180,255,0.5);
        color: #e8ecff; font: 300 13px/1.6 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.3em; text-indent: 0.3em;
        transition: background 0.3s ease;
      }
      #fortuneForm button:hover { background: rgba(140, 160, 255, 0.32); }
      #fortuneForm .skip {
        margin-top: 2px; color: #6a7aa8; font: 11px/1.6 system-ui, sans-serif;
        text-decoration: underline; cursor: pointer; background: none; border: none;
        letter-spacing: 0.05em;
      }

      #fortuneResult {
        position: absolute; left: 50%; top: 50%; z-index: 15;
        transform: translate(-50%, -50%);
        max-width: 560px; text-align: center; padding: 28px 36px;
        color: #e4e8ff; font: 300 15px/2.1 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.1em; white-space: pre-line;
        text-shadow: 0 0 20px rgba(150, 170, 255, 0.5);
        background: rgba(6, 8, 20, 0.45); backdrop-filter: blur(6px);
        border: 1px solid rgba(140, 160, 255, 0.2); border-radius: 4px;
        opacity: 0; pointer-events: none;
        transition: opacity 2s ease;
      }
      #fortuneResult.show { opacity: 1; }

      #vision {
        position: fixed; inset: 0; z-index: 30;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(4,4,14,0.88) 0%, rgba(2,2,10,0.65) 100%);
        opacity: 0; transition: opacity 1.8s ease;
      }
      #vision.show { opacity: 1; }
      #vision .label {
        color: #a8b4e8; font: 300 12px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.4em; text-indent: 0.4em; opacity: 0.85;
      }
      #vision .text {
        margin-top: 16px; max-width: 560px; padding: 0 24px;
        color: #f0f2ff; font: 300 20px/2 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.08em; text-shadow: 0 0 24px rgba(170, 180, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="narration"></div>
    <div id="chartLegend"></div>
    <div id="intro">
      <div class="title">O R B I T &nbsp; S Y N T H</div>
      <div class="subtitle">占いで描く、あなたの小さな宇宙</div>
    </div>
    <div id="methodSelect">
      <div class="label">どの占いで、あなたの宇宙を描きますか</div>
      <div class="methods">
        <button type="button" data-method="astrology">西洋占星術<small>星座の環</small></button>
        <button type="button" data-method="bazi">四柱推命<small>五行の柱</small></button>
        <button type="button" data-method="numerology">数秘術<small>数の幾何学</small></button>
      </div>
    </div>
    <form id="fortuneForm">
      <div class="label">あなたの生まれた刻を、宇宙に伝えてください</div>
      <input type="date" id="birthDate" required />
      <input type="time" id="birthTime" />
      <div id="nameField">
        <input type="text" id="birthName" placeholder="お名前(アルファベット・任意)" />
      </div>
      <button type="submit">占う</button>
      <button type="button" class="skip" id="skipFortune">占わずに始める</button>
    </form>
    <div id="fortuneResult"></div>
    <div id="vision">
      <div class="label"></div>
      <div class="text"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
