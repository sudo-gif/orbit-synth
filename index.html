<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Synth — 星と数の占い</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1b1526; overflow: hidden; height: 100%; }
      #app { position: relative; width: 100vw; height: 100vh; }

      /* フェルトのような繊維感を出すグレインオーバーレイ */
      #grain {
        position: fixed; inset: 0; z-index: 6; pointer-events: none;
        opacity: 0.1; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 160px 160px;
      }

      #vignette {
        position: absolute; inset: 0; z-index: 5; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(20,12,28,0.6) 100%);
      }

      #intro {
        position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        pointer-events: none; background: #1b1526;
        transition: opacity 2.5s ease, background-color 2.5s ease;
      }
      #intro.fade { opacity: 0; background-color: transparent; }
      #intro .title {
        color: #f7e8d4; font: 300 14px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.5em; text-indent: 0.5em; opacity: 0;
        animation: titleIn 3s ease forwards 0.3s;
      }
      #intro .subtitle {
        margin-top: 18px; color: #d9b98a; font: 300 12px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.3em; text-indent: 0.3em; opacity: 0;
        animation: titleIn 3s ease forwards 1.1s;
      }
      @keyframes titleIn {
        from { opacity: 0; filter: blur(4px); }
        to { opacity: 1; filter: blur(0); }
      }

      #narration {
        position: absolute; left: 50%; top: 12%; z-index: 10;
        transform: translate(-50%, -50%);
        color: #f3e4d0; font: 300 15px/1.9 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.15em; text-align: center; white-space: nowrap;
        text-shadow: 0 0 16px rgba(230, 180, 130, 0.5);
        opacity: 0; pointer-events: none;
        transition: opacity 2.2s ease;
      }
      #narration.show { opacity: 0.9; }

      .felt-panel {
        background: rgba(60, 42, 70, 0.6); backdrop-filter: blur(6px);
        border: 2px dashed rgba(247, 232, 212, 0.4); border-radius: 22px;
      }

      #chartLegend {
        position: absolute; left: 50%; bottom: 20px; z-index: 10;
        transform: translateX(-50%);
        color: #e8d4c0; font: 13px/1.8 system-ui, sans-serif; letter-spacing: 0.05em;
        text-align: center; white-space: nowrap; opacity: 0; pointer-events: none;
        transition: opacity 2s ease;
      }
      #chartLegend.show { opacity: 0.9; }

      #powerSpot {
        position: absolute; right: 20px; bottom: 20px; z-index: 10;
        width: min(240px, 60vw); box-sizing: border-box; padding: 14px 18px;
        color: #f3e4d0; font: 12px/1.7 system-ui, sans-serif; text-align: left;
        opacity: 0; pointer-events: none; transition: opacity 2s ease;
      }
      #powerSpot.show { opacity: 0.95; }
      #powerSpot .spot-label {
        font: 300 11px/1.6 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.2em; color: #d9b98a; display: block; margin-bottom: 4px;
      }
      #powerSpot .spot-name { font-weight: 600; font-size: 14px; }
      #powerSpot .spot-place { color: #c9b4a0; font-size: 11px; }
      #powerSpot .spot-desc { margin-top: 6px; color: #e8d4c0; }

      #backButton {
        position: absolute; left: 20px; top: 20px; z-index: 16;
        padding: 8px 16px; border-radius: 16px; cursor: pointer;
        background: rgba(60, 42, 70, 0.55); border: 1px dashed rgba(247,232,212,0.4);
        color: #f3e4d0; font: 12px/1.6 system-ui, sans-serif; letter-spacing: 0.05em;
        opacity: 0; pointer-events: none; transition: opacity 1.2s ease, background 0.3s ease;
      }
      #backButton.show { opacity: 0.85; pointer-events: auto; }
      #backButton:hover { background: rgba(80, 56, 92, 0.7); }

      #methodSelect, #fortuneForm {
        position: absolute; left: 50%; top: 50%; z-index: 15;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        padding: 32px 40px;
        opacity: 0; pointer-events: none;
        transition: opacity 1.8s ease;
      }
      #methodSelect.show, #fortuneForm.show { opacity: 1; pointer-events: auto; }
      #methodSelect .label, #fortuneForm .label {
        color: #e8d4c0; font: 300 13px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.2em; text-align: center;
      }
      #methodSelect .methods { display: flex; gap: 12px; }
      #methodSelect button {
        padding: 14px 20px; border-radius: 16px; cursor: pointer; min-width: 120px;
        background: rgba(217, 185, 138, 0.14); border: 2px dashed rgba(247,232,212,0.4);
        color: #f7e8d4; font: 300 13px/1.7 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.15em; transition: background 0.3s ease;
      }
      #methodSelect button:hover { background: rgba(217, 185, 138, 0.3); }
      #methodSelect button small { display: block; margin-top: 4px; color: #c9ab8a; font-size: 11px; letter-spacing: 0.05em; }

      #fortuneForm input {
        background: rgba(255,245,230,0.08); border: 1px solid rgba(247,232,212,0.4);
        color: #f7e8d4; padding: 8px 12px; border-radius: 10px; font: 13px system-ui, sans-serif;
        color-scheme: dark;
      }
      #fortuneForm #nameField { display: none; }
      #fortuneForm.numerology #nameField { display: block; }
      #fortuneForm #nameField input { width: 200px; }
      #fortuneForm button[type="submit"] {
        margin-top: 4px; padding: 9px 28px; border-radius: 16px; cursor: pointer;
        background: rgba(217, 185, 138, 0.22); border: 2px dashed rgba(247,232,212,0.5);
        color: #f7e8d4; font: 300 13px/1.6 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.3em; text-indent: 0.3em;
        transition: background 0.3s ease;
      }
      #fortuneForm button[type="submit"]:hover { background: rgba(217, 185, 138, 0.38); }
      #fortuneForm .skip {
        margin-top: 2px; color: #c9ab8a; font: 11px/1.6 system-ui, sans-serif;
        text-decoration: underline; cursor: pointer; background: none; border: none;
        letter-spacing: 0.05em;
      }

      #fortuneResult {
        position: absolute; left: 50%; top: 50%; z-index: 15;
        transform: translate(-50%, -50%);
        width: min(560px, 86vw); box-sizing: border-box;
        text-align: center; padding: 28px 36px;
        color: #f7e8d4; font: 300 15px/2.1 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.1em; white-space: pre-line;
        text-shadow: 0 0 18px rgba(230, 180, 130, 0.4);
        opacity: 0; pointer-events: none;
        transition: opacity 2s ease;
      }
      #fortuneResult.show { opacity: 1; }

      #vision {
        position: fixed; inset: 0; z-index: 30;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(30,18,36,0.85) 0%, rgba(14,9,20,0.72) 100%);
        opacity: 0; transition: opacity 1.8s ease;
      }
      #vision.show { opacity: 1; }
      #vision .label {
        color: #d9b98a; font: 300 12px/1.8 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.4em; text-indent: 0.4em; opacity: 0.9;
      }
      #vision .text {
        margin-top: 16px; width: min(560px, 86vw); box-sizing: border-box; padding: 0 24px;
        color: #f7e8d4; font: 300 20px/2 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.08em; text-shadow: 0 0 22px rgba(230, 180, 130, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="grain"></div>
    <div id="vignette"></div>
    <div id="narration"></div>
    <div id="chartLegend"></div>
    <div id="powerSpot"></div>
    <button id="backButton" type="button">← 占い直す</button>
    <div id="intro">
      <div class="title">O R B I T &nbsp; S Y N T H</div>
      <div class="subtitle">占いで描く、あなたの小さな宇宙</div>
    </div>
    <div id="methodSelect" class="felt-panel">
      <div class="label">どの占いで、あなたの宇宙を描きますか</div>
      <div class="methods">
        <button type="button" data-method="astrology">西洋占星術<small>星座の環</small></button>
        <button type="button" data-method="bazi">四柱推命<small>五行の柱</small></button>
        <button type="button" data-method="numerology">数秘術<small>数の幾何学</small></button>
      </div>
    </div>
    <form id="fortuneForm" class="felt-panel">
      <div class="label">あなたの生まれた刻を、宇宙に伝えてください</div>
      <input type="date" id="birthDate" required />
      <input type="time" id="birthTime" />
      <div id="nameField">
        <input type="text" id="birthName" placeholder="お名前(アルファベット・任意)" />
      </div>
      <button type="submit">占う</button>
      <button type="button" class="skip" id="skipFortune">占わずに始める</button>
    </form>
    <div id="fortuneResult" class="felt-panel"></div>
    <div id="vision">
      <div class="label"></div>
      <div class="text"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
